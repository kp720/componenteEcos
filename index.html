<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/componente.css">
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        background: var(--ec-bg);
        color: var(--ec-text);
        font-family: var(--ec-font-body);
      }
      .page {
        max-width: 760px;
        margin: 0 auto;
        padding: 56px 20px 90px;
      }
      header {
        margin-bottom: 34px;
      }
      h1 {
        font-family: var(--ec-font-display);
        font-size: clamp(1.9rem, 5vw, 2.5rem);
        margin: 0 0 12px;
      }
      header p {
        color: var(--ec-text-muted);
        line-height: 1.6;
        max-width: 60ch;
        margin: 0;
      }
      code.inline {
        font-family: monospace;
        background: var(--ec-surface);
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 0.85em;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <h1>Ecos</h1>
        <p>
          Pasa el cursor sobre cada sección, la imagen cambia
          junto a una animación y se reproduce un sonido distinto por cada opción.
          Ideal como selector de servicios, productos o categorías.
        </p>
      </header>

      <div id="mi-selector"></div>

    </div>

    <script src="js/componente.js"></script>
    <script>
      new Ecos("#mi-selector", {
        items: [
          {
            label: "Diseño",
            description: "Interfaces claras.",
            image: "img/icon-design.svg",
            imageHover: "img/icon-design-hover.svg",
            sound: "audio/tone-design.wav"
          },
          {
            label: "Desarrollo Web",
            description: "Sitios funcionales.",
            image: "img/icon-dev.svg",
            imageHover: "img/icon-dev-hover.svg",
            sound: "audio/tone-dev.wav"
          },
          {
            label: "Marketing Digital",
            description: "Estrategias para conectar.",
            image: "img/icon-marketing.svg",
            imageHover: "img/icon-marketing-hover.svg",
            sound: "audio/tone-marketing.wav"
          },
          {
            label: "Soporte Técnico",
            description: "Ayuda cuando la necesitas.",
            image: "img/icon-support.svg",
            imageHover: "img/icon-support-hover.svg",
            sound: "audio/tone-support.wav"
          },
          {
            label: "Analítica de Datos",
            description: "Decisiones en datos.",
            image: "img/icon-analytics.svg",
            imageHover: "img/icon-analytics-hover.svg",
            sound: "audio/tone-analytics.wav"
          }
        ],
        onSelect: function (item) {
          console.log("Seleccionado:", item.label);
        }
      });
    </script>
  </body>
</html>
